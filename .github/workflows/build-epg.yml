name: Build EPG
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 4:17 AM Jamaica time
  workflow_dispatch:
  push:
    paths: ['source/**', 'scripts/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build guide and playlists
        run: python scripts/build_epg.py "https://raw.githubusercontent.com/${{ github.repository }}/main"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz playlist_all.m3u playlist_guide_only.m3u
          git diff --cached --quiet || git commit -m "Daily EPG refresh $(date -u +%F)"
          git push
